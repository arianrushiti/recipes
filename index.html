<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Recipes</title>
    <meta name="description" content="Four recipes written as plain recipe pages: chipotle steak rice bowl, chipotle chicken rice bowl, Costco chicken rice, and high-protein baked mac and cheese." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recipes" />
    <meta property="og:description" content="Four recipes written as plain recipe pages: chipotle steak rice bowl, chipotle chicken rice bowl, Costco chicken rice, and high-protein baked mac and cheese." />
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/12-LSIS1N_sVzjM7GP43NaMG23-fYwO63=w1600" />
    <style>
      :root {
        --bg: #fdfcf9;
        --surface: #ffffff;
        --ink: #1c1a17;
        --ink-soft: #57534b;
        --line: #e4e0d6;
        --accent: #b3371c;
        --accent-soft: #fbeae4;
        --check: #2e7d46;
        --shadow: 0 2px 14px rgba(28, 26, 23, 0.08);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16140f;
          --surface: #211e18;
          --ink: #f2efe8;
          --ink-soft: #b3aca0;
          --line: #3a362c;
          --accent: #ff8a66;
          --accent-soft: #3a241c;
          --check: #6fce8f;
          --shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }
      .view[hidden] { display: none; }

      /* Index */
      .index-head { padding: 32px 0 4px; }
      .index-head h1 {
        font-family: ui-serif, "New York", Georgia, serif;
        font-size: 2.4rem; line-height: 1.1; margin: 0; font-weight: 700;
      }
      .cards { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
      @media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
      .card {
        display: block; text-decoration: none; color: inherit;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
      }
      .card img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
      .card-body { padding: 16px 18px 18px; }
      .card-body h2 {
        font-family: ui-serif, "New York", Georgia, serif;
        font-size: 1.35rem; line-height: 1.2; margin: 0 0 8px; font-weight: 700;
      }
      .card-meta { color: var(--ink-soft); font-size: 0.95rem; margin: 0; }

      /* Recipe pages */
      .recipe { padding-top: 20px; }
      .backlink {
        display: inline-flex; align-items: center; min-height: 44px;
        color: var(--accent); text-decoration: none; font-weight: 600; font-size: 1rem;
        margin: 28px 0 0;
      }
      .hero { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 14px; }
      .recipe h1 {
        font-family: ui-serif, "New York", Georgia, serif;
        font-size: 2.3rem; line-height: 1.12; margin: 22px 0 18px; font-weight: 700;
      }
      .meta-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
        background: var(--line); border: 1px solid var(--line); border-radius: 12px;
        overflow: hidden; margin: 0 0 8px;
      }
      @media (min-width: 620px) { .meta-grid { grid-template-columns: repeat(3, 1fr); } }
      .meta-cell { background: var(--surface); padding: 12px 16px; }
      .meta-cell .k { display: block; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
      .meta-cell .v { display: block; font-size: 1.12rem; font-weight: 600; margin-top: 2px; }
      .recipe h2 {
        font-family: ui-serif, "New York", Georgia, serif;
        font-size: 1.55rem; margin: 36px 0 14px; font-weight: 700;
      }
      .ingredients { list-style: none; margin: 0; padding: 0; }
      .ingredients li { border-bottom: 1px solid var(--line); }
      .ingredients li:last-child { border-bottom: none; }
      .ingredients label {
        display: flex; align-items: flex-start; gap: 14px;
        padding: 13px 4px; min-height: 48px; cursor: pointer;
        font-size: 1.12rem;
      }
      .ingredients input[type="checkbox"] {
        flex: none; width: 26px; height: 26px; margin: 1px 0 0;
        accent-color: var(--check);
      }
      .ingredients label:has(input:checked) .ing-text { color: var(--ink-soft); text-decoration: line-through; }
      .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
      .steps li {
        display: flex; gap: 18px; padding: 18px 0;
        border-bottom: 1px solid var(--line);
        font-size: 1.3rem; line-height: 1.55;
      }
      .steps li:last-child { border-bottom: none; }
      .steps .num {
        flex: none; width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent-soft); color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 1.2rem; margin-top: 2px;
      }
      .steps p { margin: 0; }
      .tools { margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 12px; }
      .tools button {
        min-height: 44px; padding: 10px 18px; font-size: 1rem; font-weight: 600;
        border-radius: 10px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink); cursor: pointer;
      }
      .tools button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
<main class="view" id="view-index">
        <div class="index-head">
          <h1>Recipes</h1>
        </div>
        <div class="cards">
          <a class="card" href="chipotle-steak-rice-bowl.html">
            <img src="https://lh3.googleusercontent.com/d/12-LSIS1N_sVzjM7GP43NaMG23-fYwO63=w1600" alt="Sliced chipotle steak over cilantro lime rice with a lime wedge" />
            <div class="card-body">
              <h2>Chipotle Steak Rice Bowl</h2>
              <p class="card-meta">35 min total · Serves 2 · Easy</p>
            </div>
          </a>
          <a class="card" href="chipotle-chicken-rice-bowl.html">
            <img src="https://lh3.googleusercontent.com/d/18dHLntzIhoQZ62AbQlHsL4_JLh_F6AnS=w1600" alt="Diced chipotle chicken over cilantro lime rice" />
            <div class="card-body">
              <h2>Chipotle Chicken Rice Bowl</h2>
              <p class="card-meta">35 min total · Serves 2 · Easy</p>
            </div>
          </a>
          <a class="card" href="viral-costco-chicken-rice.html">
            <img src="https://lh3.googleusercontent.com/d/10hfjKLo2C3o1CVYjyZbJc8LJVsFedGfU=w1600" alt="Shredded rotisserie chicken folded into seasoned rice with green onions" />
            <div class="card-body">
              <h2>Viral Costco Chicken Rice</h2>
              <p class="card-meta">30 min total · Serves 4 · Easy</p>
            </div>
          </a>
          <a class="card" href="high-protein-baked-mac-and-cheese.html">
            <img src="https://lh3.googleusercontent.com/d/1wkNfjG5qsjWm_bbKe4UV7TD5KpbBo32e=w1600" alt="Baked cavatappi mac and cheese with a golden brown top in a 9x13 dish" />
            <div class="card-body">
              <h2>High-Protein Baked Mac and Cheese</h2>
              <p class="card-meta">50 min total · Serves 12 · Medium</p>
            </div>
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
